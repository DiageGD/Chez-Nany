<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Chez Nany</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Parisienne&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
</head>
  
<body>
    <header>
      <nav class="main-nav">
        <div class="logo">
          <a href="index.html">
            <img
              src="assets/logo-light.png"
              alt="Logo clair"
              class="logo-light"
            />
            <img
              src="assets/logo-dark.png"
              alt="Logo foncé"
              class="logo-dark"
            />
          </a>
        </div>

        <div class="nav-links">
          <a href="index.html">Accueil</a>
          <a href="about.html">Présentation du restaurant</a>
          <a href="assets/Menu.pdf" target="_blank">Voir la carte</a>
          <a href="reservation.html">Réserver une table</a>
          <a href="contact.html">Où nous trouver ?</a>
        </div>

        <a id="navLogoLink" class="nav-logo" href="#">
          <img src="assets/account.png" alt="Compte client" class="nav-logo-img">
        </a>

        <button class="nav-toggle">☰</button>
      </nav>
    </header>

    <main style="display: flex; align-items: center; justify-content: center;">
      <div class="auth-container">
        <h1>Connexion</h1>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Adresse Email</label>
            <input id="loginEmail" type="email" placeholder="jean.dupont@gmail.com" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Mot de passe</label>
            <input id="loginPassword" type="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn-premium">Se connecter</button>
        </form>

        <p id="msg"></p>
        
        <div class="auth-switch-link">
          Pas encore de compte ? <a href="signup.html">Créer un compte ici</a>
        </div>
      </div>
    </main>

    <footer>
      <p>
        © 2026 — Site web réalisé par
        <a href="https://diagegd.github.io/portfolio" target="_blank">
          Tiago Da Silva </a
        >. Les droits d'exploitation du site sont détenus par le restaurant
        <a href="index.html"> Chez Nany </a>.
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js" defer></script>
    <script src="nav.js" defer></script>
    <script src="index.js" defer></script>
</body>
</html>
