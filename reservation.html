<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Mon Compte - Chez Nany</title>
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpg">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900&family=Parisienne&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="main-nav">
        <div class="logo">
          <a href="index.html">
            <img
              src="assets/logo-light.png"
              alt="Logo clair"
              class="logo-light"
            />
            <img
              src="assets/logo-dark.png"
              alt="Logo foncé"
              class="logo-dark"
            />
          </a>
        </div>

        <div class="nav-links">
          <a href="index.html">Accueil</a>
          <a href="about.html">Présentation du restaurant</a>
          <a href="assets/Menu.pdf" target="_blank">Voir la carte</a>
          <a href="reservation.html">Réserver une table</a>
          <a href="contact.html">Où nous trouver ?</a>
        </div>

        <a id="navLogoLink" class="nav-logo" href="#">
          <img src="assets/account.png" alt="Compte client" class="nav-logo-img">
        </a>

        <button class="nav-toggle">☰</button>
      </nav>
    </header>

    <main style="display: flex; align-items: center; justify-content: center;">
      <div class="auth-container">
        <h1>Réserver une table</h1>
        <p style="font-family: 'Inter', sans-serif; color: #e0d4b8; margin-bottom: 25px;">
          Réservez votre moment d'exception en quelques instants.
        </p>
        
        <form id="reservationForm" style="background: transparent; padding: 0; box-shadow: none; max-width: 100%;">
          <div class="form-group">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" name="firstname" placeholder="Ex: Jean" required />
          </div>
          
          <div class="form-group">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" name="lastname" placeholder="Ex: Dupont" required />
          </div>

          <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" placeholder="Ex: jean.dupont@gmail.com" required />
          </div>

          <div class="form-group">
            <label for="phone">Numéro de téléphone</label>
            <input type="tel" id="phone" name="phone" placeholder="Ex: 06 12 34 56 78" required />
          </div>

          <div class="form-group">
            <label for="people">Nombre de personnes</label>
            <input type="number" id="people" name="people" placeholder="Nombre de couverts" min="1" max="10" required />
          </div>
          
          <div class="form-group">
            <label for="date">Date de votre visite</label>
            <input type="date" id="date" name="date" required />
          </div>
          
          <div class="form-group">
            <label for="time">Créneau horaire</label>
            <select id="time" name="time" required>
              <option value="" disabled selected>Choisir un créneau...</option>
            </select>
          </div>

          <button type="submit" class="btn-premium">Confirmer la réservation</button>
        </form>

        <p id="message" style="margin-top: 15px; font-family:'Inter', sans-serif; font-size: 0.9em; color: #efefef;"></p>
      </div>
    </main>
    
    <footer>
      <p>
        © 2026 — Site web réalisé par
        <a href="https://diagegd.github.io/portfolio" target="_blank">
          Tiago Da Silva </a
        >. Les droits d'exploitation du site sont détenus par le restaurant
        <a href="index.html"> Chez Nany </a>.
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="reservation.js"></script>
    <script src="nav.js" defer></script>
  </body>
</html>
